<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
    <title>GLaDOS</title></head>
<body>
<header><img id="icon" src="icons/base.png" alt="GLaDOS">
    <div><h1 data-i18n="name"></h1><small>1.2.4.10 · <span data-i18n="flow"></span></small></div>
</header>
<main>
    <section><strong id="state"></strong>
        <progress id="progress" hidden></progress>
        <div class="actions">
            <button id="start" data-i18n="start"></button>
            <button id="page" data-i18n="page"></button>
        </div>
    </section>
    <section>
        <div class="row">
            <div><h2 data-i18n="daily"></h2><small data-i18n="scheduleHint"></small></div>
            <label class="switch"><input id="enabled" type="checkbox"><span></span></label></div>
        <div class="time"><label for="time" data-i18n="every"></label><input type="time" id="time" value="09:30"
                                                                             step="60"><small id="saved" role="status"
                                                                                              data-i18n="saved"></small>
        </div>
        <small id="next"></small><small id="error" hidden></small></section>
    <section><h2 data-i18n="records"></h2>
        <pre id="logs"></pre>
    </section>
    <section class="promo">
        <h2 data-i18n="promo"></h2>
        <small data-i18n="promoHint"></small>
        <div class="coupon"><code id="coupon">WELCOME10</code>
            <button id="copy" data-i18n="copy"></button></div>
    </section>
    <footer>
        <div><span class="green" data-i18n="success"></span> · <span class="red" data-i18n="failure"></span> · <span
                class="blue" data-i18n="timer"></span></div>
        <p data-i18n="verify"></p></footer>
</main>
<script src="popup.js"></script>
</body>
</html>
